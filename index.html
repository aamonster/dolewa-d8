<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolewa D8 Printer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Dolewa D8 <small id="pageModified" title="Last-Modified from the web server"></small></h1>

    <textarea
        id="editor"
        placeholder="Введите HTML, например: <b>Hello</b>"
    ></textarea>

    <div class="options">
        <label>
            <input type="checkbox" id="dithering">
            Dithering
        </label>

        <label>
            Darkness
            <input type="range" id="darkness" min="0" max="255" value="128">
            <span id="darknessValue">128</span>
        </label>

        <label>
            Contrast
            <input type="range" id="contrast" min="0" max="255" value="0" disabled>
            <span id="contrastValue">0</span>
        </label>

        <label>
            Scale
            <input type="range" id="scale" min="50" max="200" step="10" value="100">
            <span id="scaleValue">100%</span>
        </label>

        <label>
            Print density
            <input type="range" id="density" min="0" max="7" value="3">
            <span id="densityValue">3</span>
        </label>
    </div>

    <div class="actions">
        <button id="connectBtn">Connect printer</button>
        <button id="printBtn">Print</button>
        <button id="clearBtn">Clear</button>
        <label class="debug-toggle"><input type="checkbox" id="debugCheck"> Debug</label>
    </div>

    <div id="previewWrap">
        <canvas id="previewCanvas"></canvas>
        <div id="info"></div>
    </div>

    <div id="status">Ready</div>
    <div id="debugPanel" hidden>
        <textarea id="debugLog" readonly spellcheck="false" aria-label="Debug log"></textarea>
        <button id="copyDebugBtn" type="button">Copy log</button>
    </div>

    <iframe id="renderFrame" title="Print preview source"></iframe>

    <script src="script.js"></script>
</body>
</html>
