<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolewa D8 Printer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #e8e8e8;
        font-family: Arial, sans-serif;
        color: #222;
    }

    h1 {
        margin-top: 0;
    }

    #editor {
        display: block;
        width: 384px;
        min-height: 180px;
        padding: 8px;
        border: 1px solid #999;
        background: white;
        font: 16px/1.2 Arial, sans-serif;
        resize: vertical;
    }

    .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    button {
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
    }

    #previewWrap {
        margin-top: 20px;
    }

    #previewCanvas {
        display: block;
        background: white;
        image-rendering: pixelated;
        border: 1px solid #999;
    }

    #info {
        margin-top: 8px;
        font-size: 13px;
        color: #555;
    }

    #status {
        margin-top: 12px;
        padding: 8px;
        background: white;
        border: 1px solid #ccc;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
    }

    /*
     * Это реальная область, из которой html2canvas делает снимок.
     * Она находится за пределами окна, но сама остаётся обычным DOM.
     */
    #renderTarget {
        position: absolute;
        left: -10000px;
        top: 0;

        width: 384px;
        min-height: 1px;
        padding: 8px;

        background: white;
        color: black;

        font-family: Arial, sans-serif;
        font-size: 16px;
        line-height: 1.2;

        overflow: visible;
    }

    #renderTarget img {
        max-width: 100%;
    }

    #renderTarget table {
        border-collapse: collapse;
    }

    #renderTarget td,
    #renderTarget th {
        border: 1px solid #000;
        padding: 2px 4px;
    }

    #renderTarget pre {
        white-space: pre-wrap;
    }
</style>
</head>

<body>

<h1>Dolewa D8</h1>

<textarea id="editor"
    placeholder="Введите HTML, например: <b>Hello</b>"></textarea>

<div class="actions">
    <button id="renderBtn">Render preview</button>
    <button id="connectBtn">Connect printer</button>
    <button id="printBtn">Print</button>
    <button id="clearBtn">Clear</button>
</div>

<div id="previewWrap">
    <canvas id="previewCanvas"></canvas>
    <div id="info"></div>
</div>

<div id="status">Ready</div>

<!--
    Здесь HTML из textarea превращается именно в DOM.
    Никакого textContent / innerText.
-->
<div id="renderTarget"></div>

<script>
"use strict";

const editor = document.getElementById("editor");
const renderTarget = document.getElementById("renderTarget");
const previewCanvas = document.getElementById("previewCanvas");
const info = document.getElementById("info");
const status = document.getElementById("status");

const renderBtn = document.getElementById("renderBtn");
const connectBtn = document.getElementById("connectBtn");
const printBtn = document.getElementById("printBtn");
const clearBtn = document.getElementById("clearBtn");

const PRINT_WIDTH = 384;
const BLOCK_SIZE = 96;

/* ============================================================
   Status
   ============================================================ */

function setStatus(message) {
    status.textContent = message;
    console.log(message);
}

/* ============================================================
   UTF-8 Base64
   ============================================================ */

function encodeBase64UTF8(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";

    for (const byte of bytes) {
        binary += String.fromCharCode(byte);
    }

    return btoa(binary);
}

function decodeBase64UTF8(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new TextDecoder().decode(bytes);
}

/* ============================================================
   URL hash
   ============================================================ */

function updateHtmlHash() {
    const encoded = encodeBase64UTF8(editor.value);
    history.replaceState(null, "", "#html=" + encoded);
}

function loadHtmlFromHash() {
    if (!location.hash.startsWith("#html=")) {
        return false;
    }

    try {
        const encoded = location.hash.substring(6);
        editor.value = decodeBase64UTF8(encoded);
        return true;
    } catch (e) {
        console.error(e);
        setStatus("Ошибка чтения HTML из URL: " + e);
        return false;
    }
}

/* ============================================================
   Rendering
   ============================================================ */

/*
 * Главная часть:
 *
 * textarea содержит HTML как обычный текст.
 * При рендеринге этот текст напрямую назначается innerHTML
 * отдельного DOM-элемента.
 */
async function renderDOM() {
    renderTarget.innerHTML = editor.value;

    /*
     * Ждём загрузки картинок.
     */
    const images = [...renderTarget.querySelectorAll("img")];

    await Promise.all(images.map(img => {
        if (img.complete) {
            return Promise.resolve();
        }

        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
        });
    }));

    /*
     * Даём браузеру применить стили и пересчитать layout.
     */
    await new Promise(resolve => requestAnimationFrame(resolve));

    return renderTarget;
}

async function renderPreview() {
    try {
        setStatus("Rendering...");

        /*
         * Хэш содержит именно исходный HTML из textarea.
         */
        updateHtmlHash();

        await renderDOM();

        const canvas = await html2canvas(renderTarget, {
            backgroundColor: "#ffffff",
            width: PRINT_WIDTH,
            scale: 1,
            useCORS: true,
            allowTaint: false,
            logging: false
        });

        const raster = rasterize(canvas);

        showPreview(raster);

        setStatus(
            "Rendered: " +
            raster.width +
            " × " +
            raster.height +
            " px"
        );

        return raster;

    } catch (e) {
        console.error(e);
        setStatus("Render error: " + e);
        throw e;
    }
}

/* ============================================================
   Rasterization
   ============================================================ */

const DITHER_4x4 = [
    [0, 8, 2, 10],
    [12, 4, 14, 6],
    [3, 11, 1, 9],
    [15, 7, 13, 5]
];

function rasterize(canvas) {
    const width = PRINT_WIDTH;
    const height = canvas.height;

    const ctx = canvas.getContext("2d", {
        willReadFrequently: true
    });

    const imageData = ctx.getImageData(
        0,
        0,
        Math.min(width, canvas.width),
        height
    );

    const actualWidth = Math.min(width, canvas.width);

    /*
     * 1 bit per pixel.
     * Black = 1
     * White = 0
     */
    const bytesPerRow = Math.ceil(actualWidth / 8);
    const data = new Uint8Array(bytesPerRow * height);

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < actualWidth; x++) {
            const p = (y * actualWidth + x) * 4;

            const r = imageData.data[p];
            const g = imageData.data[p + 1];
            const b = imageData.data[p + 2];
            const a = imageData.data[p + 3];

            let gray;

            if (a === 0) {
                gray = 255;
            } else {
                gray =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;
            }

            const dither =
                (DITHER_4x4[y & 3][x & 3] - 7.5) * 8;

            const threshold = 128 + dither;

            if (gray < threshold) {
                const byteIndex =
                    y * bytesPerRow +
                    (x >> 3);

                const bit =
                    7 - (x & 7);

                data[byteIndex] |= (1 << bit);
            }
        }
    }

    return {
        width: actualWidth,
        height,
        bytesPerRow,
        data
    };
}

/* ============================================================
   Preview
   ============================================================ */

function showPreview(raster) {
    previewCanvas.width = raster.width;
    previewCanvas.height = raster.height;

    // Показываем 1:1 — 384 пикселя принтера = 384 CSS-пикселя
    previewCanvas.style.width = raster.width + "px";
    previewCanvas.style.height = raster.height + "px";

    const ctx = previewCanvas.getContext("2d");

    ctx.fillStyle = "#fff";
    ctx.fillRect(
        0,
        0,
        raster.width,
        raster.height
    );

    const imageData = ctx.createImageData(
        raster.width,
        raster.height
    );

    for (let y = 0; y < raster.height; y++) {
        for (let x = 0; x < raster.width; x++) {
            const byteIndex =
                y * raster.bytesPerRow +
                (x >> 3);

            const bit =
                7 - (x & 7);

            const black =
                (raster.data[byteIndex] &
                    (1 << bit)) !== 0;

            const p =
                (y * raster.width + x) * 4;

            const value = black ? 0 : 255;

            imageData.data[p] = value;
            imageData.data[p + 1] = value;
            imageData.data[p + 2] = value;
            imageData.data[p + 3] = 255;
        }
    }

    ctx.putImageData(imageData, 0, 0);

    info.textContent =
        raster.width +
        " × " +
        raster.height +
        " px, " +
        (raster.width / 8).toFixed(1) +
        " × " +
        (raster.height / 8).toFixed(1) +
        " mm, " +
        raster.data.length +
        " bytes";
}
/* ============================================================
   BLE
   ============================================================ */

const SERVICE_UUID =
    "0000ffe6-0000-1000-8000-00805f9b34fb";

const WRITE_UUID =
    "0000ffe1-0000-1000-8000-00805f9b34fb";

const NOTIFY_UUID =
    "0000ffe2-0000-1000-8000-00805f9b34fb";

let bluetoothDevice = null;
let writeCharacteristic = null;
let notifyCharacteristic = null;

let rxQueue = [];
let rxWaiters = [];

/* ============================================================
   BLE helpers
   ============================================================ */

function bytesToHex(bytes) {
    return [...bytes]
        .map(x => x.toString(16).padStart(2, "0"))
        .join(" ");
}

function arraysEqual(a, b) {
    if (a.length !== b.length) {
        return false;
    }

    for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) {
            return false;
        }
    }

    return true;
}

function onNotification(event) {
    const bytes = new Uint8Array(
        event.target.value.buffer
    );

    console.log(
        "RX:",
        bytesToHex(bytes)
    );

    /*
     * Telemetry packet.
     */
    if (bytes[0] === 0x5a && bytes[1] === 0x02) {
        return;
    }

    /*
     * Retry / delay packets are not the packets we're waiting for.
     */
    if (
        bytes[0] === 0x5a &&
        (
            bytes[1] === 0x05 ||
            bytes[1] === 0x07
        )
    ) {
        return;
    }

    const waiter = rxWaiters.shift();

    if (waiter) {
        waiter(bytes);
    } else {
        rxQueue.push(bytes);
    }
}

function waitForPacket(timeout = 5000) {
    return new Promise((resolve, reject) => {
        if (rxQueue.length) {
            resolve(rxQueue.shift());
            return;
        }

        const timer = setTimeout(() => {
            const index = rxWaiters.indexOf(handler);

            if (index >= 0) {
                rxWaiters.splice(index, 1);
            }

            reject(
                new Error("BLE packet timeout")
            );
        }, timeout);

        function handler(packet) {
            clearTimeout(timer);
            resolve(packet);
        }

        rxWaiters.push(handler);
    });
}

async function writeBytes(bytes) {
    console.log(
        "TX:",
        bytesToHex(bytes)
    );

    await writeCharacteristic.writeValue(
        new Uint8Array(bytes)
    );
}

function crc16Xmodem(data) {
    let crc = 0x0000;

    for (const byte of data) {
        crc ^= byte << 8;

        for (let i = 0; i < 8; i++) {
            if (crc & 0x8000) {
                crc =
                    ((crc << 1) ^ 0x1021) &
                    0xffff;
            } else {
                crc =
                    (crc << 1) &
                    0xffff;
            }
        }
    }

    return crc;
}

/* ============================================================
   BLE connect
   ============================================================ */

async function connectPrinter() {
    if (!navigator.bluetooth) {
        throw new Error(
            "Web Bluetooth is not supported by this browser"
        );
    }

    setStatus("Scanning for LX-D08...");

    bluetoothDevice =
        await navigator.bluetooth.requestDevice({
            filters: [
                {
                    name: "LX-D08"
                }
            ],
            optionalServices: [
                SERVICE_UUID
            ]
        });

    bluetoothDevice.addEventListener(
        "gattserverdisconnected",
        () => {
            setStatus("Printer disconnected");
        }
    );

    setStatus(
        "Connecting to " +
        (bluetoothDevice.name || "printer") +
        "..."
    );

    const server =
        await bluetoothDevice.gatt.connect();

    const service =
        await server.getPrimaryService(
            SERVICE_UUID
        );

    writeCharacteristic =
        await service.getCharacteristic(
            WRITE_UUID
        );

    notifyCharacteristic =
        await service.getCharacteristic(
            NOTIFY_UUID
        );

    rxQueue = [];
    rxWaiters = [];

    notifyCharacteristic.addEventListener(
        "characteristicvaluechanged",
        onNotification
    );

    await notifyCharacteristic.startNotifications();

    setStatus("Connected. Handshaking...");

    await handshake();

    setStatus("Printer ready");
}

/* ============================================================
   Dolewa handshake
   ============================================================ */

async function handshake() {
    /*
     * 1. Request status / MAC.
     */
    await writeBytes([
        0x5a, 0x01, 0x00
    ]);

    const statusPacket =
        await waitForPacket(5000);

    if (
        statusPacket[0] !== 0x5a ||
        statusPacket[1] !== 0x01
    ) {
        throw new Error(
            "Unexpected status response: " +
            bytesToHex(statusPacket)
        );
    }

    const mac =
        statusPacket.slice(4, 10);

    console.log(
        "MAC:",
        bytesToHex(mac)
    );

    /*
     * 2. Generate 10 random bytes.
     * Avoid 00 and FF.
     */
    const random = new Uint8Array(10);

    for (let i = 0; i < random.length; i++) {
        let value;

        do {
            value =
                Math.floor(Math.random() * 254) + 1;
        } while (
            value === 0x00 ||
            value === 0xff
        );

        random[i] = value;
    }

    await writeBytes([
        0x5a,
        0x0a,
        ...random
    ]);

    const lowResponse =
        await waitForPacket(5000);

    if (
        lowResponse[0] !== 0x5a ||
        lowResponse[1] !== 0x0a
    ) {
        throw new Error(
            "Unexpected 0A response: " +
            bytesToHex(lowResponse)
        );
    }

    /*
     * 3. CRC16-XMODEM for each random byte + MAC.
     */
    const low = [];
    const high = [];

    for (const value of random) {
        const input = [
            value,
            ...mac
        ];

        const crc =
            crc16Xmodem(input);

        low.push(crc & 0xff);
        high.push((crc >> 8) & 0xff);
    }

    console.log(
        "CRC low expected:",
        bytesToHex(low)
    );

    console.log(
        "CRC low received:",
        bytesToHex(
            lowResponse.slice(2)
        )
    );

    /*
     * Send high bytes.
     */
    await writeBytes([
        0x5a,
        0x0b,
        ...high
    ]);

    const finalResponse =
        await waitForPacket(5000);

    if (
        finalResponse[0] !== 0x5a ||
        finalResponse[1] !== 0x0b ||
        finalResponse[2] !== 0x01
    ) {
        throw new Error(
            "Handshake failed: " +
            bytesToHex(finalResponse)
        );
    }

    /*
     * Darkness.
     */
    await writeBytes([
        0x5a,
        0x0c,
        0x03
    ]);

    await waitForPacket(5000);
}

/* ============================================================
   Print
   ============================================================ */

async function printRaster(raster) {
    if (
        !bluetoothDevice ||
        !bluetoothDevice.gatt ||
        !bluetoothDevice.gatt.connected
    ) {
        throw new Error(
            "Printer is not connected"
        );
    }

    const totalBytes =
        raster.data.length;

    const totalBlocks =
        Math.ceil(
            totalBytes / BLOCK_SIZE
        );

    setStatus(
        "Sending " +
        totalBlocks +
        " blocks..."
    );

    /*
     * Image header.
     *
     * 5A 04
     * total blocks, uint16 BE
     * 00 00
     */
    await writeBytes([
        0x5a,
        0x04,
        (totalBlocks >> 8) & 0xff,
        totalBlocks & 0xff,
        0x00,
        0x00
    ]);

    /*
     * Image blocks.
     */
    for (
        let index = 0;
        index < totalBlocks;
        index++
    ) {
        const packet =
            new Uint8Array(100);

        packet[0] = 0x55;

        packet[1] =
            (index >> 8) & 0xff;

        packet[2] =
            index & 0xff;

        const start =
            index * BLOCK_SIZE;

        const end =
            Math.min(
                start + BLOCK_SIZE,
                totalBytes
            );

        packet.set(
            raster.data.slice(start, end),
            3
        );

        /*
         * packet[99] remains 0.
         */

        await new Promise(resolve =>
            setTimeout(resolve, 20)
        );

        await writeBytes(packet);

        setStatus(
            "Sending block " +
            (index + 1) +
            " / " +
            totalBlocks
        );
    }

    /*
     * Wait for printer to acknowledge image.
     */
    setStatus("Waiting for image ACK...");

    while (true) {
        const packet =
            await waitForPacket(10000);

        if (
            packet[0] === 0x5a &&
            packet[1] === 0x06
        ) {
            break;
        }

        console.log(
            "Ignoring packet while waiting for 5A 06:",
            bytesToHex(packet)
        );
    }

    /*
     * Footer.
     */
    await writeBytes([
        0x5a,
        0x04,
        (totalBlocks >> 8) & 0xff,
        totalBlocks & 0xff,
        0x01
    ]);

    setStatus("Print sent");
}

/* ============================================================
   Buttons
   ============================================================ */

renderBtn.addEventListener(
    "click",
    async () => {
        try {
            await renderPreview();
        } catch (e) {
            console.error(e);
        }
    }
);

connectBtn.addEventListener(
    "click",
    async () => {
        try {
            await connectPrinter();
        } catch (e) {
            console.error(e);

            setStatus(
                "Connection error: " +
                e.message
            );
        }
    }
);

printBtn.addEventListener(
    "click",
    async () => {
        try {
            setStatus("Rendering for print...");

            /*
             * Print uses exactly the same rendering path
             * as preview.
             */
            await renderDOM();

            const canvas =
                await html2canvas(
                    renderTarget,
                    {
                        backgroundColor: "#ffffff",
                        width: PRINT_WIDTH,
                        scale: 1,
                        useCORS: true,
                        allowTaint: false,
                        logging: false
                    }
                );

            const raster =
                rasterize(canvas);

            showPreview(raster);

            await printRaster(raster);

        } catch (e) {
            console.error(e);

            setStatus(
                "Print error: " +
                e.message
            );
        }
    }
);

clearBtn.addEventListener(
    "click",
    async () => {
        editor.value = "";

        await renderPreview();
    }
);

/* ============================================================
   Initial load
   ============================================================ */

(async function init() {
    const loaded =
        loadHtmlFromHash();

    if (loaded) {
        await renderPreview();
    }
})();
</script>

</body>
</html>
